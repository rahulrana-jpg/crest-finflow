<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#blueGradient)" opacity="0.1"/>
  
  <!-- Shield Base (Trust & Security) -->
  <path d="M100 30 L140 45 L140 90 C140 115 125 130 100 145 C75 130 60 115 60 90 L60 45 L100 30Z" 
        fill="url(#shieldGradient)" 
        stroke="url(#borderGradient)" 
        stroke-width="2.5"/>
  
  <!-- Himalayan Mountain Peaks (Nepali Cultural Element) - Subtle -->
  <path d="M70 55 L80 70 L75 70 L85 55 L90 65 L95 55 L100 65 L105 55 L110 65 L115 55 L120 70 L125 70 L130 55" 
        stroke="#E8F5E9" 
        stroke-width="1.5" 
        fill="none" 
        opacity="0.4"/>
  
  <!-- Lock/Security Icon -->
  <rect x="90" y="90" width="20" height="22" rx="2" fill="url(#lockGradient)"/>
  <path d="M95 90 L95 82 C95 78.686 97.686 76 101 76 L99 76 C95.686 76 93 78.686 93 82 L93 90" 
        stroke="url(#greenAccent)" 
        stroke-width="2.5" 
        fill="none" 
        stroke-linecap="round"/>
  <circle cx="100" cy="100" r="2.5" fill="white"/>
  <rect x="99" y="100" width="2" height="5" fill="white" rx="1"/>
  
  <!-- Digital Transaction Arrows (Circular Flow) -->
  <g opacity="0.8">
    <!-- Right Arrow -->
    <path d="M120 95 L135 95 L132 92" 
          stroke="#4CAF50" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    <path d="M135 95 L132 98" 
          stroke="#4CAF50" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    
    <!-- Bottom Arrow -->
    <path d="M105 120 L105 135 L108 132" 
          stroke="#1976D2" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    <path d="M105 135 L102 132" 
          stroke="#1976D2" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    
    <!-- Left Arrow -->
    <path d="M80 105 L65 105 L68 108" 
          stroke="#4CAF50" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    <path d="M65 105 L68 102" 
          stroke="#4CAF50" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    
    <!-- Top Arrow -->
    <path d="M95 80 L95 65 L92 68" 
          stroke="#1976D2" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    <path d="M95 65 L98 68" 
          stroke="#1976D2" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
  </g>
  
  <!-- QR-like Digital Pattern (Minimal) -->
  <g opacity="0.3">
    <rect x="145" y="70" width="4" height="4" fill="#1976D2" rx="0.5"/>
    <rect x="150" y="70" width="4" height="4" fill="#1976D2" rx="0.5"/>
    <rect x="145" y="75" width="4" height="4" fill="#4CAF50" rx="0.5"/>
    <rect x="150" y="75" width="4" height="4" fill="#1976D2" rx="0.5"/>
    
    <rect x="46" y="70" width="4" height="4" fill="#4CAF50" rx="0.5"/>
    <rect x="51" y="70" width="4" height="4" fill="#1976D2" rx="0.5"/>
    <rect x="46" y="75" width="4" height="4" fill="#1976D2" rx="0.5"/>
    <rect x="51" y="75" width="4" height="4" fill="#4CAF50" rx="0.5"/>
  </g>
  
  <!-- Traditional Nepali Pattern (Subtle decorative elements) -->
  <g opacity="0.2">
    <circle cx="100" cy="145" r="2" fill="#4CAF50"/>
    <circle cx="95" cy="145" r="1.5" fill="#1976D2"/>
    <circle cx="105" cy="145" r="1.5" fill="#1976D2"/>
  </g>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="lockGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
